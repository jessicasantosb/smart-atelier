services:
  postgres:
    image: postgres:17-alpine
    environment:
      # Local development credentials only; do not reuse them outside this compose setup.
      POSTGRES_DB: smart_atelier
      POSTGRES_USER: smart_atelier
      POSTGRES_PASSWORD: smart_atelier
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_atelier -d smart_atelier"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /workspace
    command: ["cargo", "run", "--locked"]
    init: true
    environment:
      API_ADDRESS: "0.0.0.0:3000"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:4173"
      DATABASE_URL: "postgres://smart_atelier:smart_atelier@postgres:5432/smart_atelier"
      REDIS_URL: "redis://redis:6379"
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/workspace
      - backend_target:/workspace/target
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  backend_target:
