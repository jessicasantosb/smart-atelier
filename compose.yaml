services:
  postgres:
    image: postgres:17-alpine
    environment:
      # Local development credentials only; do not reuse them outside this compose setup.
      POSTGRES_DB: smart_atelier
      POSTGRES_USER: smart_atelier
      POSTGRES_PASSWORD: smart_atelier
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_atelier -d smart_atelier"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
